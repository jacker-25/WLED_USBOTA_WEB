<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WLED Web Flash</title>
<link rel="icon" href="../assets/favicon.ico" />
<!-- CryptoJS（用于 esptool-js 烧录时 MD5 校验） -->
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
<!-- JSZip（用于日志打包下载） -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  /* DOMRAEM 品牌青蓝色 */
  --brand:#2FB8A8;
  --brand-soft:#D6F1EC;
  --brand-mid:#7DD3C8;
  --brand-deep:#1D8E84;
  --grey:#efefef;
  --grey-icon:#bfbfbf;
  --text:#333;
  --sub:#8a8a8a;
}
*{box-sizing:border-box}
body{
  margin:0;padding:16px 16px;
  background:#eef1f6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);
}
.card{
  position:relative;
  max-width:1180px;margin:0 auto;
  background:#fff;border-radius:22px;
  padding:34px 40px 40px;
  box-shadow:0 8px 30px rgba(0,0,0,.06);
}
.wiz-status{text-align:center;margin:6px 0 16px}
.wiz-status #wiz-text{font-size:21px;font-weight:400;line-height:1.6;color:var(--brand)}
.wiz-status #wiz-text b{font-weight:700}
.wiz-status .progress-box{margin:4px 0 4px}

/* ---------- 向导 ---------- */
.wiz{display:flex;align-items:flex-start;justify-content:center;gap:0}
.step{
  flex:0 0 190px;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
}
.circle{
  width:96px;height:96px;border-radius:22px;
  background:var(--grey);color:var(--grey-icon);
  display:flex;align-items:center;justify-content:center;
  transition:.3s;
}
.step.done .circle{background:var(--brand-soft);color:var(--brand)}
.step.current .circle{background:#fff;border:2px solid var(--brand);color:var(--brand)}
.step.done.current .circle{background:var(--brand-soft);border:2px solid var(--brand-mid)}

.line{
  flex:1 1 auto;height:2px;margin:47px 6px 0;
  background-image:linear-gradient(to right,var(--grey-icon) 45%,transparent 45%);
  background-size:9px 2px;background-repeat:repeat-x;
  transition:.3s;
}
.line.done{
  background-image:linear-gradient(to right,var(--brand) 45%,transparent 45%);
}

.label{margin-top:16px;font-size:13px;line-height:1.7;color:var(--sub);width:100%}
.label b{color:var(--text);font-weight:600}
.label .link{color:var(--brand);cursor:pointer;text-decoration:none}
.label .link:hover{text-decoration:underline}

.btn{
  padding:8px 22px;border:0;border-radius:4px;
  background:var(--brand);color:#fff;font-size:13px;cursor:pointer;
  transition:.2s;
}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{background:var(--grey);color:#bbb;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand-mid)}
.btn.ghost:disabled{background:#fff;color:#ccc;border-color:#ddd}
.btn.link{background:transparent;color:var(--brand);border:none;text-decoration:underline;font-size:12px;padding:6px 12px}
.btn.link:hover{color:var(--brand-deep);filter:none}

/* ---------- 进度（顶部） ---------- */
.hidden{display:none !important}    /* ← 通用隐藏，兜底所有 hidden class */
.progress-box{margin:0 0 16px;text-align:center}
.p-title{color:var(--brand);font-size:17px;font-weight:600;margin-bottom:12px}
.p-bar{height:10px;background:#ececec;border-radius:5px;overflow:hidden;max-width:560px;margin:0 auto}
.p-fill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand-deep));border-radius:5px;transition:width .3s cubic-bezier(.4,0,.2,1)}
.p-tip{margin-top:10px;font-size:13px;color:#666}

/* ---------- 烧录完成：勾圈 + 五彩纸屑 ---------- */
.done-box{margin:0 auto 10px;text-align:center;position:relative;max-width:300px}
.done-circle{width:48px;height:48px;margin:0 auto;background:var(--brand);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(47,184,168,.45);animation:donePop .5s cubic-bezier(.34,1.56,.64,1) both}
.done-circle svg{width:26px;height:26px;color:#fff}
@keyframes donePop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
/* 五彩纸屑粒子（8 个绝对定位的 SVG） */
.confetti{position:absolute;top:24px;left:50%;pointer-events:none}
.confetti svg{position:absolute;animation:confettiFly 1.4s ease-out both}
@keyframes confettiFly{0%{transform:translate(-50%,-50%) rotate(0) scale(.3);opacity:0}30%{opacity:1}100%{transform:translate(var(--cx),var(--cy)) rotate(var(--cr)) scale(1);opacity:0}}
/* 8 个位置（缩小一半适配 48px 圆圈） */
.cf1{--cx:-36px;--cy:-28px;--cr:180deg}
.cf2{--cx:-10px;--cy:-38px;--cr:60deg}
.cf3{--cx:+20px;--cy:-35px;--cr:-40deg}
.cf4{--cx:+40px;--cy:-15px;--cr:120deg}
.cf5{--cx:+38px;--cy:+18px;--cr:-130deg}
.cf6{--cx:+14px;--cy:+33px;--cr:210deg}
.cf7{--cx:-18px;--cy:+35px;--cr:-80deg}
.cf8{--cx:-38px;--cy:+15px;--cr:160deg}

.foot{margin-top:12px;text-align:center;font-size:12px;color:#aaa;min-height:16px}

/* ---------- 弹窗 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  animation:fadeIn .18s ease-out;
}
.mask.hidden{display:none}
body.no-scroll{overflow:hidden}
.dlg{
  background:#fff;border-radius:10px;width:100%;max-width:560px;
  padding:20px 26px 10px;position:relative;
  box-shadow:0 16px 50px rgba(0,0,0,.2);
  max-height:86vh;display:flex;flex-direction:column;
}
.dlg h3{margin:0 0 16px;font-size:17px;text-align:center;font-weight:700}
.dlg .x{
  position:absolute;right:16px;top:14px;cursor:pointer;color:#999;font-size:20px;line-height:1;
}
.dlg .x:hover{color:#333}
.dlg .desc{font-size:13px;color:var(--sub);text-align:center;margin:-8px 0 16px;line-height:1.7}
.dlg .desc b{color:var(--text)}
.dlg .list{overflow:auto;margin:0 -6px;padding:0 6px}
.dlg .ok{
  display:block;margin:18px auto 0;padding:9px 30px;
  border:0;border-radius:4px;background:var(--brand);color:#fff;font-size:14px;cursor:pointer;
}
.dlg .ok:disabled{background:#eee;color:#bbb;cursor:not-allowed}
.dlg .cancel{
  display:block;margin:10px auto 0;padding:8px 26px;
  border:1px solid #ddd;background:#fff;color:#666;border-radius:4px;cursor:pointer;font-size:14px;
}

/* 单选行 */
.row{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px 12px;border-radius:6px;cursor:pointer;border:1px solid transparent;
}
.row:hover{background:#fafafa}
.row.on{background:var(--brand-soft);border-color:var(--brand-mid)}
.row input{margin-top:3px;accent-color:var(--brand);flex:0 0 auto}
.row .t{font-size:14px;font-weight:600}
.row .s{font-size:12px;color:var(--sub);margin-top:2px}
.row .r{margin-left:auto;font-size:11px;color:var(--brand);background:#fff5ea;
        padding:2px 7px;border-radius:3px;align-self:center}

/* 双列联动（固件类型 / 版本） */
.picker{display:flex;border:1px solid #eee;border-radius:6px;overflow:hidden;height:280px}
.picker .col{overflow:auto}
.picker .col.left{flex:0 0 46%;border-right:1px solid #eee;background:#fafafa}
.picker .col.right{flex:1}
.picker .hd{
  font-size:11px;letter-spacing:1px;color:#aaa;text-align:center;
  padding:9px 0;border-bottom:1px solid #eee;background:#fcfcfc;
  position:sticky;top:0;
}
.picker .it{padding:12px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid #f4f4f4}
.picker .left .it.on{color:var(--brand);background:var(--brand-soft);font-weight:600}
.picker .left .it:hover{background:#f3f3f3}
.picker .right .it{display:flex;align-items:center;gap:8px}
.picker .right .it.on{background:var(--brand-soft)}
.picker .right .it:hover{background:#fdf3e7}
.picker .right .it .v{font-weight:600}
.picker .right .it .d{font-size:11px;color:var(--sub)}
.picker .right .it .tag{
  margin-left:auto;font-size:10px;color:#fff;background:var(--brand);
  padding:1px 6px;border-radius:3px;
}
.picker .empty{padding:30px 14px;text-align:center;color:#bbb;font-size:13px}

/* 两列联动型号/固件选择器 */
.pick-item{
  padding:11px 14px;border-bottom:1px solid #f4f4f4;cursor:pointer;
  transition:.12s;background:#fff;font-size:13px;
}
.pick-item:hover{background:#fafafa}
.pick-item.on{background:var(--brand-soft);color:var(--brand)}
.pick-item.on .pi-name{color:var(--brand)}
.pick-item.on .pi-sub{color:var(--brand-mid)}
.pi-name{font-weight:600;color:#333}
.pi-sub{font-size:11px;color:#888;margin-top:2px}

.warn{color:#e5533c;font-size:15px;font-weight:700;text-align:center;margin-bottom:12px}
.warn-icon{text-align:center;font-size:26px;margin-bottom:6px}

/* 烧录日志 */
.log-box{margin:20px auto 0;max-width:760px;display:none}
.log-box.show{display:block}
.log-hd{background:#343a40;color:#e9ecef;padding:6px 12px;border-radius:8px 8px 0 0;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.log-bd{background:#212529;color:#e9ecef;padding:10px;border-radius:0 0 8px 8px;height:180px;overflow-y:auto;font:12px/1.5 Consolas,Monaco,monospace}
.log-bd .ll{white-space:pre-wrap;margin:1px 0}
.log-bd .ti{color:#17a2b8}.log-bd .ts{color:#28a745}.log-bd .te{color:#dc3545}.log-bd .tw{color:#ffc107}

/* 芯片信息小卡片 */
.ci-card{
  margin-top:14px;padding:12px 16px;background:#e7f1ff;border:1px solid #b3d7ff;
  border-radius:8px;max-width:400px;margin-left:auto;margin-right:auto;
  font-size:13px;color:#06c;
}
.ci-card .row2{display:flex;gap:16px;margin-bottom:4px}
.ci-card .row2:last-child{margin-bottom:0}
.ci-card .lbl{min-width:60px;font-weight:600}

/* ---------- 右上角图标按钮 ---------- */
.top-actions{
  position:absolute;top:14px;right:22px;display:flex;gap:14px;z-index:5;
}
.ta-btn{
  width:auto;height:auto;border-radius:0;border:none;background:transparent;
  color:var(--brand);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:none;transition:.2s;position:relative;padding:4px 8px;
}
.ta-btn .icon-wrap{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--brand-mid);
  background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.04);transition:.2s;position:relative;
}
.ta-btn:hover .icon-wrap{color:var(--brand-deep);border-color:var(--brand);transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.1)}
.ta-btn:hover .lbl{color:var(--brand-deep)}
.ta-btn .tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#333;color:#fff;font-size:12px;padding:5px 10px;border-radius:4px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:.2s;z-index:10;
}
.ta-btn:hover .tip{opacity:1}
.ta-btn svg{width:18px;height:18px}
.ta-btn .lbl{
  font-size:11px;color:var(--brand);transition:.2s;white-space:nowrap;
}

/* ---------- 固件下载弹窗：三列联动 ---------- */
.picker3{display:flex;border:1px solid #eee;border-radius:6px;overflow:hidden;height:320px}
.picker3 .col{flex:1;overflow:auto;min-width:0}
.picker3 .col.c1{border-right:1px solid #eee;background:#fafafa}
.picker3 .col.c2{border-right:1px solid #eee;background:#fafafa}
.picker3 .col.c3{}
.picker3 .hd{
  font-size:11px;letter-spacing:1px;color:#aaa;text-align:center;
  padding:9px 0;border-bottom:1px solid #eee;background:#fcfcfc;position:sticky;top:0;
}
.picker3 .it{
  padding:11px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f4f4f4;
  display:flex;align-items:center;gap:8px;
}
.picker3 .it .arr{color:#ccc;font-size:11px;margin-left:auto}
.picker3 .c1 .it.on,.picker3 .c2 .it.on{color:var(--brand);background:var(--brand-soft);font-weight:600}
.picker3 .c1 .it:hover,.picker3 .c2 .it:hover{background:#f3f3f3}
.picker3 .c3 .it{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.picker3 .c3 .it .rowv{display:flex;align-items:center;gap:8px;width:100%}
.picker3 .c3 .it .v{font-weight:600}
.picker3 .c3 .it .d{font-size:11px;color:var(--sub)}
.picker3 .c3 .it .tag{
  margin-left:auto;font-size:10px;color:#fff;background:var(--brand);padding:1px 6px;border-radius:3px;
}
.picker3 .c3 .it.on{background:var(--brand-soft)}
.picker3 .c3 .it:hover{background:#fdf3e7}
.picker3 .empty{padding:30px 14px;text-align:center;color:#bbb;font-size:13px}

/* 固件下载弹窗底部信息条 */
.fw-bar{
  margin-top:12px;padding:12px 14px;background:#f8f9fa;border-radius:6px;
  display:flex;align-items:center;gap:16px;font-size:12px;color:#666;flex-wrap:wrap;
}
.fw-bar .sha{font-family:Consolas,Monaco,monospace;color:#888;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fw-bar .size{color:var(--brand);font-weight:600}

@media (max-width:900px){
  .wiz{flex-direction:column;align-items:center;gap:18px}
  .step{flex:none}
  .line{display:none}
  .label{min-height:0;margin-bottom:6px}
}
</style>
</head>
<body>

<div class="card">
  <!-- ============ 右上角图标按钮 ============ -->
  <div class="top-actions">
    <button class="ta-btn" id="btn-fw">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 2H8a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-1 14H9v-2h6v2zm0-4H9v-2h6v2zm0-4H9V6h6v2z"/></svg>
        <span class="tip">固件库</span>
      </div>
      <span class="lbl">固件库</span>
    </button>
    <button class="ta-btn" id="btn-log">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        <span class="tip">日志</span>
      </div>
      <span class="lbl">日志</span>
    </button>
    <button class="ta-btn" id="btn-forum">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-3 11H7v-2h10v2zm0-3H7V8h10v2z"/></svg>
        <span class="tip">论坛</span>
      </div>
      <span class="lbl">论坛</span>
    </button>
  </div>

  <!-- ============ 全局状态区（h1 下方、向导上方） ============ -->
  <div class="wiz-status" id="wiz-status">
    <!-- ① 静态状态文字（初始 / 连接后 / 选完固件） -->
    <div id="wiz-text">请将你的<b>设备</b>插入 USB 接口，<br>然后点击<b>连接</b>按钮继续。</div>

    <!-- ② 烧录进度条（hidden） -->
    <div class="progress-box hidden" id="progress-box">
      <div class="p-title" id="p-title">烧录中，请勿拔出设备或关闭浏览器</div>
      <div class="p-bar"><div class="p-fill" id="p-fill"></div></div>
      <div class="p-tip" id="p-tip">准备中…</div>
    </div>

    <!-- ③ 烧录完成小勾圈（hidden） -->
    <div class="done-box hidden" id="done-box">
      <div style="margin-bottom:8px;color:var(--brand);font-size:14px;font-weight:600" id="done-msg">烧录完成</div>
      <div class="done-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
    </div>
  </div>

  <!-- ============ 三步向导 ============ -->
  <div class="wiz">
    <div class="step current" id="step-1">
      <div class="circle" id="icon-1">
        <!-- USB Flash Drive 风格 -->
        <svg viewBox="0 0 48 48" width="44" height="44" fill="currentColor">
          <!-- 接口 -->
          <rect x="18" y="4" width="12" height="8" rx="1"/>
          <rect x="20" y="6" width="2" height="4"/>
          <rect x="26" y="6" width="2" height="4"/>
          <!-- 设备主体 -->
          <rect x="12" y="12" width="24" height="28" rx="4"/>
          <!-- 品牌装饰 -->
          <circle cx="19" cy="26" r="2" fill="#fff"/>
          <circle cx="29" cy="26" r="2" fill="#fff"/>
          <rect x="18" y="32" width="12" height="2.5" rx="1" fill="#fff"/>
        </svg>
      </div>
      <div class="label" id="label-1"></div>
      <button class="btn" id="btn-1">连接</button>
    </div>

    <div class="line" id="line-1"></div>

    <div class="step" id="step-2">
      <div class="circle" id="icon-2">
        <!-- 固件文档 + 勾选 风格 -->
        <svg viewBox="0 0 48 48" width="44" height="44" fill="currentColor">
          <!-- 文档轮廓 -->
          <path d="M14 6 L30 6 L38 14 L38 42 L14 42 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <!-- 折角 -->
          <path d="M30 6 L30 14 L38 14" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <!-- 勾选框（底部） -->
          <rect x="17" y="28" width="8" height="8" rx="1.5" fill="currentColor"/>
          <!-- 对勾 -->
          <path d="M19 32.5 L21 34.5 L24.5 31" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- 文档文字装饰 -->
          <rect x="27" y="20" width="8" height="1.6" rx="0.8"/>
          <rect x="27" y="24" width="6" height="1.6" rx="0.8"/>
        </svg>
      </div>
      <div class="label" id="label-2"></div>
      <button class="btn ghost" id="btn-2" style="display:none">选择</button>
    </div>

    <div class="line" id="line-2"></div>

    <div class="step" id="step-3">
      <div class="circle" id="icon-3">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
          <path d="M12 2 4 10h5v10h6V10h5L12 2zM4 22h16v-2H4v2z"/>
        </svg>
      </div>
      <div class="label" id="label-3"></div>
      <button class="btn" id="btn-3" style="display:none">烧录</button>
    </div>
  </div>

  <!-- 芯片信息 -->
  <div class="ci-card" id="ci-card" style="display:none"></div>

  <!-- ============ 日志区 ============ -->
  <div class="log-box" id="log-box">
    <div class="log-hd"><span>📋 Flasher Log</span><button class="btn ghost" id="btnClr" style="padding:3px 10px;font-size:12px">清屏</button></div>
    <div class="log-bd" id="logBd"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<!-- ============ 弹窗 ============ -->
<div class="mask hidden" id="mask">
  <div class="dlg" id="dlg"></div>
</div>

<script>
// Safari 浏览器不支持 Web Serial，提前拦截
(function(){
  var isSafari = /constructor/i.test(window.HTMLElement) ||
    (function(p){return "[object SafariRemoteNotification]"===p.toString()})(!window.safari||"u"===typeof safari&&window.safari.pushNotification);
  if(isSafari){
    document.querySelector('.card').innerHTML =
      '<h3 style="text-align:center;color:#e5533c">❌ Safari 浏览器不支持 Web Serial</h3>' +
      '<p style="text-align:center;color:#666">请使用桌面版 Chrome 或 Edge 浏览器打开本页。</p>';
  }
})();
</script>
<script src="index.ts" type="module"></script>
</body>
</html>
