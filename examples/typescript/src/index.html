<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WLED Web Flash</title>
<link rel="icon" href="../assets/favicon.ico" />

<!-- ========= Bootstrap 5.3 CSS + Bootstrap Icons ========= -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<!-- CryptoJS（用于 esptool-js 烧录时 MD5 校验） -->
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
<!-- JSZip（用于日志打包下载） -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<style>
/* ======== Bootstrap 主题覆盖 ======== */
:root{
  /* DOMRAEM 品牌青蓝色 → 覆盖 Bootstrap $primary */
  --bs-primary:        #2FB8A8;
  --bs-primary-rgb:    47, 184, 168;
  --bs-primary-dark:   #1D8E84;
  --brand-soft:        #D6F1EC;
  --brand-mid:         #7DD3C8;
  --grey:              #efefef;
  --grey-icon:         #bfbfbf;
  --text:              #333;
  --sub:               #8a8a8a;
}
/* 强制覆盖 Bootstrap primary 相关组件颜色 */
.btn-primary{
  background-color: var(--bs-primary) !important;
  border-color: var(--bs-primary) !important;
  color:#fff !important;
}
.btn-primary:hover:not(:disabled){
  background-color: var(--bs-primary-dark) !important;
  border-color: var(--bs-primary-dark) !important;
  color:#fff !important;
}
/* 禁用态：黑白低亮 */
.btn-primary:disabled{
  background-color:#e9ecef !important;
  border-color:#dee2e6 !important;
  color:#adb5bd !important;
}
.btn-outline-primary{
  color: var(--bs-primary) !important;
  border-color: var(--bs-primary) !important;
}
.btn-outline-primary:hover:not(:disabled){
  background-color: var(--bs-primary) !important;
  border-color: var(--bs-primary) !important;
}
.btn-outline-primary:disabled{
  color: #ccc !important;
  border-color: #ddd !important;
  background: #fff !important;
}
/* 标题栏右侧区域：按钮左右排列，不换行 */
.header-right{
  display:flex !important;
  flex-direction:row !important;
  flex-wrap:nowrap !important;
  align-items:center !important;
  white-space:nowrap !important;
}

/* ========= Modal 垂直位置：对齐有效内容区域（上半部分居中） ========= */
/* Bootstrap 默认 min-height:100vh 让弹窗在整个视口正中，改成 55vh 让弹窗偏上 */
#mainModal .modal-dialog-centered{
  min-height:55vh !important;
}
/* 确认弹窗：中等偏小 460px */
#mainModal .modal-dialog.modal-confirm{
  max-width:460px !important;
}
/* 三列选择器弹窗：580px（比 modal-lg 800px 窄，够放三列又不浪费） */
#mainModal .modal-dialog.modal-picker{
  max-width:520px !important;
}

/* pick-item：型号名/副标题单行不换行 */
.pick-item .pi-name,
.pick-item .pi-sub{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.btn-link{
  color: var(--bs-primary) !important;
  text-decoration: none !important;
}
.btn-link:hover{
  color: var(--bs-primary-dark) !important;
  text-decoration: underline !important;
}
.text-brand{ color: var(--bs-primary); }
.bg-brand{ background-color: var(--bs-primary) !important; }
.progress-bar.bg-brand{ background-color: var(--bs-primary) !important; }

/* ======== 页面骨架 ======== */
body{
  margin:0;padding:16px 16px;
  background:#eef1f6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);
}
.page-card{
  position:relative;
  max-width:1180px;margin:0 auto;
  background:#fff;border-radius:22px;
  padding:34px 40px 40px;
  box-shadow:0 8px 30px rgba(0,0,0,.06);
}

/* 通用隐藏（兜底） */
.hidden{display:none !important}

/* ======== 状态区 ======== */
.wiz-status{text-align:center;margin:6px 0 16px}
#wiz-text{font-size:21px;font-weight:400;line-height:1.6;color:var(--bs-primary)}
#wiz-text b{font-weight:700}

/* ======== 向导（Bootstrap 没有 Stepper，保留自定义 SVG 图标） ======== */
.wiz{display:flex;align-items:flex-start;justify-content:center;gap:0}
.step{
  flex:0 0 190px;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
}
.circle{
  width:96px;height:96px;border-radius:22px;
  background:var(--grey);color:var(--grey-icon);
  display:flex;align-items:center;justify-content:center;
  transition:.3s;
}
.step.done .circle{background:var(--brand-soft);color:var(--bs-primary)}
.step.current .circle{background:#fff;border:2px solid var(--bs-primary);color:var(--bs-primary)}
.step.done.current .circle{background:var(--brand-soft);border:2px solid var(--brand-mid)}

.line{
  flex:1 1 auto;height:2px;margin:47px 6px 0;
  background-image:linear-gradient(to right,var(--grey-icon) 45%,transparent 45%);
  background-size:9px 2px;background-repeat:repeat-x;
  transition:.3s;
}
.line.done{
  background-image:linear-gradient(to right,var(--bs-primary) 45%,transparent 45%);
}

.label{margin-top:16px;font-size:13px;line-height:1.7;color:var(--sub);width:100%}
.label b{color:var(--text);font-weight:600}
.label .link{color:var(--bs-primary);cursor:pointer;text-decoration:none}
.label .link:hover{text-decoration:underline}

/* ======== 烧录完成：勾圈 + 五彩纸屑 ======== */
.done-box{margin:0 auto 10px;text-align:center;position:relative;max-width:300px}
.done-circle{width:48px;height:48px;margin:0 auto;background:var(--bs-primary);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(47,184,168,.45);animation:donePop .5s cubic-bezier(.34,1.56,.64,1) both}
.done-circle svg{width:26px;height:26px;color:#fff}
@keyframes donePop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

.foot{margin-top:12px;text-align:center;font-size:12px;color:#aaa;min-height:16px}

/* ======== 弹窗：单选行 ======== */
.radio-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px 12px;border-radius:6px;cursor:pointer;border:1px solid transparent;
}
.radio-row:hover{background:#fafafa}
.radio-row.on{background:var(--brand-soft);border-color:var(--brand-mid)}
.radio-row input{margin-top:3px;accent-color:var(--bs-primary);flex:0 0 auto}
.radio-row .t{font-size:14px;font-weight:600}
.radio-row .s{font-size:12px;color:var(--sub);margin-top:2px}
.radio-row .r{margin-left:auto;font-size:11px;color:var(--bs-primary);background:#fff5ea;
        padding:2px 7px;border-radius:3px;align-self:center}

/* ======== 两列联动型号/固件选择器 ======== */
.picker{display:flex;border:1px solid #eee;border-radius:6px;overflow:hidden;height:280px}
.picker .col{overflow:auto}
.picker .col.left{flex:0 0 46%;border-right:1px solid #eee;background:#fafafa}
.picker .col.right{flex:1}
.picker .hd{
  font-size:11px;letter-spacing:1px;color:#aaa;text-align:center;
  padding:9px 0;border-bottom:1px solid #eee;background:#fcfcfc;
  position:sticky;top:0;
}
.picker .it{padding:12px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid #f4f4f4}
.picker .left .it.on{color:var(--bs-primary);background:var(--brand-soft);font-weight:600}
.picker .left .it:hover{background:#f3f3f3}
.picker .right .it{display:flex;align-items:center;gap:8px}
.picker .right .it.on{background:var(--brand-soft)}
.picker .right .it:hover{background:#fdf3e7}
.picker .right .it .v{font-weight:600}
.picker .right .it .d{font-size:11px;color:var(--sub)}
.picker .right .it .tag{
  margin-left:auto;font-size:10px;color:#fff;background:var(--bs-primary);
  padding:1px 6px;border-radius:3px;
}
.picker .empty{padding:30px 14px;text-align:center;color:#bbb;font-size:13px}

.pick-item{
  padding:11px 14px;border-bottom:1px solid #f4f4f4;cursor:pointer;
  transition:.12s;background:#fff;font-size:13px;
}
.pick-item:hover{background:#fafafa}
.pick-item.on{background:var(--brand-soft);color:var(--bs-primary)}
.pick-item.on .pi-name{color:var(--bs-primary)}
.pick-item.on .pi-sub{color:var(--brand-mid)}
.pi-name{font-weight:600;color:#333}
.pi-sub{font-size:11px;color:#888;margin-top:2px}

/* ======== 烧录日志（Bootstrap dark 风格） ======== */
.log-box{margin:20px auto 0;max-width:760px;display:none}
.log-box.show{display:block}
.log-bd{background:#212529;color:#e9ecef;padding:10px;border-radius:0 0 8px 8px;height:180px;overflow-y:auto;font:12px/1.5 Consolas,Monaco,monospace}
.log-bd .ll{white-space:pre-wrap;margin:1px 0}
.log-bd .ti{color:#17a2b8}.log-bd .ts{color:#28a745}.log-bd .te{color:#dc3545}.log-bd .tw{color:#ffc107}

/* ======== 芯片信息小卡片 ======== */
.ci-card{
  margin-top:14px;padding:12px 16px;background:#e7f1ff;border:1px solid #b3d7ff;
  border-radius:8px;max-width:400px;margin-left:auto;margin-right:auto;
  font-size:13px;color:#06c;
}
.ci-card .row2{display:flex;gap:16px;margin-bottom:4px}
.ci-card .row2:last-child{margin-bottom:0}
.ci-card .lbl{min-width:60px;font-weight:600}

/* ======== 右上角图标按钮 ======== */
.top-actions{
  position:absolute;top:14px;right:22px;display:flex;gap:14px;z-index:5;
}
.ta-btn{
  width:auto;height:auto;border-radius:0;border:none;background:transparent;
  color:var(--bs-primary);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:none;transition:.2s;position:relative;padding:4px 8px;
}
.ta-btn .icon-wrap{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--brand-mid);
  background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.04);transition:.2s;position:relative;
}
.ta-btn:hover .icon-wrap{color:var(--bs-primary-dark);border-color:var(--bs-primary);transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.1)}
.ta-btn:hover .lbl{color:var(--bs-primary-dark)}
.ta-btn .lbl{
  font-size:11px;color:var(--bs-primary);transition:.2s;white-space:nowrap;
}

/* ======== 响应式：窄屏隐藏文字标签、缩小图标、防挤压 ======== */
@media (max-width: 900px){
  .ta-btn .lbl{ display:none; }           /* 文字标签隐藏，只留图标 */
  .ta-btn .icon-wrap{ width:32px;height:32px; }
  .top-actions{ gap:8px; top:10px; right:14px; }
  .ta-btn{ padding:2px 4px; gap:0; }
  .page-card{ padding:40px 24px 32px; }  /* 顶部 padding 加大，标题不被挡 */
  .wiz-status{ margin-top:52px; }          /* 标题和图标保持距离 */
}
@media (max-width: 560px){
  .top-actions{ position:static; justify-content:center; margin-bottom:12px; }
  .page-card{ padding:24px 16px 24px; }
  .wiz-status{ margin-top:12px; }
}

/* ======== 固件下载弹窗：三列联动 ======== */
.picker3{display:flex;border:1px solid #eee;border-radius:6px;overflow:hidden;height:320px}
.picker3 .col{flex:1;overflow:auto;min-width:0}
.picker3 .col.c1{border-right:1px solid #eee;background:#fafafa}
.picker3 .col.c2{border-right:1px solid #eee;background:#fafafa}
.picker3 .hd{
  font-size:11px;letter-spacing:1px;color:#aaa;text-align:center;
  padding:9px 0;border-bottom:1px solid #eee;background:#fcfcfc;position:sticky;top:0;
}
.picker3 .it{
  padding:11px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f4f4f4;
  display:flex;align-items:center;gap:8px;
}
.picker3 .it .arr{color:#ccc;font-size:11px;margin-left:auto}
.picker3 .c1 .it.on,.picker3 .c2 .it.on{color:var(--bs-primary);background:var(--brand-soft);font-weight:600}
.picker3 .c1 .it:hover,.picker3 .c2 .it:hover{background:#f3f3f3}
.picker3 .c3 .it{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.picker3 .c3 .it .rowv{display:flex;align-items:center;gap:8px;width:100%}
.picker3 .c3 .it .v{font-weight:600}
.picker3 .c3 .it .d{font-size:11px;color:var(--sub)}
.picker3 .c3 .it .tag{
  margin-left:auto;font-size:10px;color:#fff;background:var(--bs-primary);padding:1px 6px;border-radius:3px;
}
.picker3 .c3 .it.on{background:var(--brand-soft)}
.picker3 .c3 .it:hover{background:#fdf3e7}
.picker3 .empty{padding:30px 14px;text-align:center;color:#bbb;font-size:13px}

.fw-bar{
  margin-top:12px;padding:12px 14px;background:#f8f9fa;border-radius:6px;
  display:flex;align-items:center;gap:16px;font-size:12px;color:#666;flex-wrap:wrap;
}

/* ======== 进度条（Bootstrap progress-bar 覆盖渐变） ======== */
.progress-bar.bg-brand{
  background:linear-gradient(90deg,var(--bs-primary),var(--bs-primary-dark)) !important;
  transition:width .3s cubic-bezier(.4,0,.2,1);
}

@media (max-width:900px){
  .wiz{flex-direction:column;align-items:center;gap:18px}
  .step{flex:none}
  .line{display:none}
  .label{min-height:0;margin-bottom:6px}
}
</style>
</head>
<body>

<div class="page-card">
  <!-- ============ 右上角图标按钮 ============ -->
  <div class="top-actions">
    <button class="ta-btn" id="btn-fw">
      <div class="icon-wrap">
        <i class="bi bi-memory fs-5"></i>
      </div>
      <span class="lbl">固件库</span>
    </button>
    <button class="ta-btn" id="btn-log">
      <div class="icon-wrap">
        <i class="bi bi-journal-text fs-5"></i>
      </div>
      <span class="lbl">日志</span>
    </button>
    <button class="ta-btn" id="btn-forum">
      <div class="icon-wrap">
        <i class="bi bi-chat-dots fs-5"></i>
      </div>
      <span class="lbl">论坛</span>
    </button>
  </div>

  <!-- ============ 全局状态区 ============ -->
  <div class="wiz-status" id="wiz-status">
    <!-- ① 静态状态文字 -->
    <div id="wiz-text">请将你的<b>设备</b>插入 USB 接口，<br>然后点击<b>连接</b>按钮继续。</div>

    <!-- ② 烧录进度条（Bootstrap progress） -->
    <div class="progress-box hidden" id="progress-box">
      <div class="text-brand fw-semibold mb-2" id="p-title" style="font-size:17px">烧录中，请勿拔出设备或关闭浏览器</div>
      <div class="progress" style="height:10px;max-width:560px;margin:0 auto">
        <div class="progress-bar bg-brand" id="p-fill" role="progressbar" style="width:0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
      <div id="p-tip" class="text-muted mt-2" style="font-size:13px">准备中…</div>
    </div>

    <!-- ③ 烧录完成小勾圈 -->
    <div class="done-box hidden" id="done-box">
      <div class="text-brand fw-semibold mb-2" id="done-msg" style="font-size:14px">烧录完成</div>
      <div class="done-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
    </div>
  </div>

  <!-- ============ 三步向导 ============ -->
  <div class="wiz">
    <div class="step current" id="step-1">
      <div class="circle" id="icon-1">
        <!-- USB Flash Drive 风格 -->
        <svg viewBox="0 0 48 48" width="44" height="44" fill="currentColor">
          <rect x="18" y="4" width="12" height="8" rx="1"/>
          <rect x="20" y="6" width="2" height="4"/>
          <rect x="26" y="6" width="2" height="4"/>
          <rect x="12" y="12" width="24" height="28" rx="4"/>
          <circle cx="19" cy="26" r="2" fill="#fff"/>
          <circle cx="29" cy="26" r="2" fill="#fff"/>
          <rect x="18" y="32" width="12" height="2.5" rx="1" fill="#fff"/>
        </svg>
      </div>
      <div class="label" id="label-1"></div>
      <button class="btn btn-primary" id="btn-1">连接</button>
    </div>

    <div class="line" id="line-1"></div>

    <div class="step" id="step-2">
      <div class="circle" id="icon-2">
        <!-- 固件文档 + 勾选 风格 -->
        <svg viewBox="0 0 48 48" width="44" height="44" fill="currentColor">
          <path d="M14 6 L30 6 L38 14 L38 42 L14 42 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M30 6 L30 14 L38 14" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <rect x="17" y="28" width="8" height="8" rx="1.5" fill="currentColor"/>
          <path d="M19 32.5 L21 34.5 L24.5 31" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="27" y="20" width="8" height="1.6" rx="0.8"/>
          <rect x="27" y="24" width="6" height="1.6" rx="0.8"/>
        </svg>
      </div>
      <div class="label" id="label-2"></div>
      <button class="btn btn-primary" id="btn-2" style="display:none">选择</button>
    </div>

    <div class="line" id="line-2"></div>

    <div class="step" id="step-3">
      <div class="circle" id="icon-3">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
          <path d="M12 2 4 10h5v10h6V10h5L12 2zM4 22h16v-2H4v2z"/>
        </svg>
      </div>
      <div class="label" id="label-3"></div>
      <button class="btn btn-primary" id="btn-3" style="display:none">烧录</button>
    </div>
  </div>

  <!-- 芯片信息 -->
  <div class="ci-card" id="ci-card" style="display:none"></div>

  <!-- ============ 日志区（Bootstrap dark + monospace） ============ -->
  <div class="log-box" id="log-box">
    <div class="d-flex justify-content-between align-items-center bg-dark text-light rounded-top px-3 py-2" style="font-size:12px">
      <span><i class="bi bi-terminal me-1"></i>Flasher Log</span>
      <button class="btn btn-outline-primary btn-sm" id="btnClr">清屏</button>
    </div>
    <div class="log-bd" id="logBd"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<!-- ============ Bootstrap Modal（通用弹窗容器，JS 动态填充内容） ============ -->
<div class="modal fade" id="mainModal" tabindex="-1" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered" id="modal-dialog">
    <div class="modal-content">
      <!-- header 由 JS 动态填充 -->
      <div class="modal-header" id="modal-header">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <!-- body 由 JS 动态填充 -->
      <div class="modal-body" id="modal-body"></div>
      <!-- footer 由 JS 动态填充（可选） -->
      <div class="modal-footer justify-content-center" id="modal-footer"></div>
    </div>
  </div>
</div>

<script>
// Safari 浏览器不支持 Web Serial，提前拦截
(function(){
  var isSafari = /constructor/i.test(window.HTMLElement) ||
    (function(p){return "[object SafariRemoteNotification]"===p.toString()})(!window.safari||"u"===typeof safari&&window.safari.pushNotification);
  if(isSafari){
    document.querySelector('.page-card').innerHTML =
      '<h3 class="text-center text-danger">❌ Safari 浏览器不支持 Web Serial</h3>' +
      '<p class="text-center text-muted">请使用桌面版 Chrome 或 Edge 浏览器打开本页。</p>';
  }
})();
</script>

<!-- Bootstrap 5.3 JS Bundle（含 Modal、Progress 等组件逻辑） -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="index.ts" type="module"></script>
</body>
</html>
